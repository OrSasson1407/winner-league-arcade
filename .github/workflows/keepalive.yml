# Keeps the Render free service awake: it sleeps after ~15 idle minutes, and the next visitor then
# waits 30-60 seconds for the whole site. A ping every 10 minutes keeps it up; one service running
# all month uses ~744 of the plan's 750 free hours. (GitHub may delay scheduled runs by a few minutes,
# and pauses them after 60 days without commits: re-enable from the Actions tab if that happens.)
name: Keep the server awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --silent --show-error --max-time 90 --retry 2 --retry-delay 10 https://winner-league-arcade.onrender.com/health
