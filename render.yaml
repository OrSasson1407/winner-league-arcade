# Render blueprint for Winner League Arcade (game + online 1v1 server).
# Render: New > Blueprint > pick this repository. The free plan sleeps after ~15 idle minutes;
# the first visit after that takes ~30-60 seconds to wake it up.
services:
  - type: web
    name: winner-league-arcade
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
